<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olive Hub - 사내 웹앱 허브</title>
    <style>
        :root {
            --olive-green: #82DC28;
            --text-main: #000000;
            --bg-color: #ffffff;
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            font-family: 'Pretendard', sans-serif;
        }

        /* 개선된 로고 영역 */
        header {
            padding: 30px;
            display: flex;
            align-items: center;
            border-bottom: 2px solid #f0f0f0;
        }

        .logo-text {
            font-size: 28px;
            font-weight: 950;
            letter-spacing: -0.05em;
            display: flex;
            align-items: baseline;
        }

        .logo-olive { color: var(--olive-green); }
        .logo-hub { color: var(--text-main); font-weight: 700; margin-left: 6px; }

        /* 그리드 영역 */
        main { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .app-card {
            border: 1px solid #eee;
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .app-card:hover { border-color: var(--olive-green); background: #fdfdfd; }

        /* 반응형: 모바일은 1열 */
        @media(max-width: 768px) {
            .grid-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-text">
            <span class="logo-olive">OLIVE</span>
            <span class="logo-hub">HUB</span>
        </div>
    </header>

    <main>
        <div class="grid-container" id="appGrid">
            <!-- 자바스크립트로 동일하게 생성 가능 -->
        </div>
    </main>

    <script>
        const apps = [
            { title: "유통 데이터", desc: "분석 대시보드" },
            { title: "업무 자동화", desc: "기안문 생성" },
            { title: "할인 계산기", desc: "마진 시뮬레이션" },
            { title: "피드백 함", desc: "아이디어 제안" },
            { title: "링크 공유", desc: "리소스 관리" },
            { title: "일정 관리", desc: "프로젝트 캘린더" },
            { title: "코딩 가이드", desc: "개발 팁 공유" },
            { title: "MD 보드", desc: "진열 시뮬레이션" },
            { title: "앱 제안", desc: "신규 개발 아이디어" }
        ];

        const grid = document.getElementById('appGrid');
        apps.forEach(app => {
            grid.innerHTML += `
                <div class="app-card">
                    <div style="font-size:24px; font-weight:700;">${app.title}</div>
                    <div style="font-size:12px; color:#888; margin-top:8px;">${app.desc}</div>
                </div>
            `;
        });
    </script>
</body>
</html>
