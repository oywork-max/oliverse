<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OLIVERSE - 사내 웹앱 허브</title>
    <style>
        :root {
            --olive-green: #82DC28;
            --text-main: #000000;
            --bg-color: #ffffff;
        }

        body { background-color: var(--bg-color); margin: 0; font-family: 'Pretendard', sans-serif; }

        header { padding: 30px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #f0f0f0; }
        .logo-text { font-size: 28px; font-weight: 950; letter-spacing: -0.05em; display: flex; align-items: baseline; }
        .logo-olive { color: var(--olive-green); }
        .logo-verse { color: var(--text-main); font-weight: 700; margin-left: 2px; }
        
        .admin-btn { background: none; border: none; cursor: pointer; font-size: 24px; color: #333; }

        main { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        .grid-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        
        .app-card { 
            border: 1px solid #eee; 
            border-radius: 16px; 
            padding: 20px; 
            display: flex; 
            align-items: center; 
            gap: 15px;
            cursor: pointer; 
            transition: 0.2s; 
        }
        .app-card:hover { border-color: var(--olive-green); background: #fdfdfd; }
        .icon-box { font-size: 32px; }
        .text-box { display: flex; flex-direction: column; }

        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); justify-content:center; align-items:center; }
        .modal-content { background: white; padding: 30px; border-radius: 16px; width: 400px; }

        @media(max-width: 768px) { .grid-container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <header>
        <div class="logo-text">
            <span class="logo-olive">OLIVE</span>
            <span class="logo-verse">RSE</span>
        </div>
        <button class="admin-btn" onclick="checkAuth()">⚙️</button>
    </header>

    <main>
        <div class="grid-container" id="appGrid"></div>
    </main>

    <div id="adminModal" class="modal">
        <div class="modal-content">
            <h3>관리자 설정</h3>
            <div id="adminSettings"></div>
            <button onclick="closeModal()">닫기</button>
        </div>
    </div>

    <script>
        const PASSWORD_HASH = "b46617e944737d2f97c079234857b293375b5b487e384661005a96f131a40348";

        let apps = [
            {"id": 1, "title": "올리브캐시", "desc": "송금 및 환전 계산기", "url": "https://oywork-max.github.io/olivecash/", "icon": "💰", "show": true},
            {"id": 2, "title": "올리브미팅룸", "desc": "중례 및 회의록 관리", "url": "https://oywork-max.github.io/olivemeetingroom/", "icon": "📝", "show": true},
            {"id": 3, "title": "로스율 계산기", "desc": "매장 로스율 관리", "url": "https://oywork-max.github.io/loss/", "icon": "📉", "show": true},
            {"id": 4, "title": "유통기한 검사기한 보기", "desc": "유통기한 검사 도구", "url": "https://oywork-max.github.io/bb/", "icon": "🕒", "show": true},
            {"id": 5, "title": "휴식 순서 정하기", "desc": "컬러 기반 휴식 로테이션", "url": "https://oywork-max.github.io/abcd/", "icon": "🎨", "show": true}
        ];

        function renderApps() {
            const grid = document.getElementById('appGrid');
            grid.innerHTML = '';
            apps.filter(app => app.show).forEach(app => {
                grid.innerHTML += `<div class="app-card" onclick="window.open('${app.url}')">
                    <div class="icon-box">${app.icon}</div>
                    <div class="text-box">
                        <div style="font-weight:700;">${app.title}</div>
                        <div style="font-size:12px; color:#888;">${app.desc}</div>
                    </div>
                </div>`;
            });
        }

        async function checkAuth() {
            const pwd = prompt("관리자 암호를 입력하세요:");
            if (!pwd) return;

            const msgUint8 = new TextEncoder().encode(pwd);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

            if (hashHex === PASSWORD_HASH) {
                document.getElementById('adminModal').style.display = 'flex';
                renderAdminSettings();
            } else {
                alert("암호가 틀렸습니다.");
            }
        }

        function renderAdminSettings() {
            const settings = document.getElementById('adminSettings');
            settings.innerHTML = apps.map(app => `
                <div style="margin-bottom: 10px;">
                    <input type="checkbox" ${app.show ? 'checked' : ''} onchange="toggleApp(${app.id})">
                    ${app.title}
                </div>
            `).join('');
        }

        function toggleApp(id) {
            const app = apps.find(a => a.id === id);
            app.show = !app.show;
            renderApps();
        }

        function closeModal() { document.getElementById('adminModal').style.display = 'none'; }

        renderApps();
    </script>
</body>
</html>
